# Isolated maintenance branch only. No application checkout, build, dump, migration or deploy.
name: CP7 fixed-target read-only database channel verification
'on':
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed maintenance SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cp7-readonly-db-channel
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sansan20036/iHear-website' && github.ref == 'refs/heads/cp7/verify-db-channel'
      && inputs.reviewed_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PG_IMAGE: postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    steps:
    - name: Prepare fixed native client and reviewed read-only inputs
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        private_dir="$(mktemp -d "$RUNNER_TEMP/cp7-db-channel.XXXXXXXX")"
        printf 'CP7_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"
        export CP7_PRIVATE_DIR="$private_dir"
        timeout 120s docker pull "$PG_IMAGE" > "$private_dir/image-pull.log" 2>&1
        docker run --rm --network none --entrypoint psql "$PG_IMAGE" --version
        python3 - <<'CP7_FILES'
        import base64, json, os
        from pathlib import Path
        root=Path(os.environ['CP7_PRIVATE_DIR'])
        files=json.loads('{"channel_check.py":"","readonly.sql":"","expected.json":"","provider-ca.crt":""}')
        for name,data in files.items():
            (root/name).write_bytes(base64.b64decode(data))
        print('Prepared reviewed SQL, helper, public CA and expected metadata; no credentials present.')
        CP7_FILES
    - name: Verify authorized target and native read-only session
      env:
        BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      shell: bash
      run: |
        set -euo pipefail
        python3 "$CP7_PRIVATE_DIR/channel_check.py"
    - name: Remove private credential and temporary container files
      if: always()
      shell: bash
      run: |
        python3 - <<'CP7_CLEANUP'
        import os,re,shutil,subprocess,sys
        from pathlib import Path
        ok=True
        name='cp7-db-channel-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
        if not re.fullmatch(r'cp7-db-channel-[0-9]+-[0-9]+',name):
            raise SystemExit('Invalid cleanup identity')
        try:
            check=subprocess.run(['docker','inspect','--format','{{.Id}}',name],capture_output=True,text=True,timeout=10)
            if check.returncode==0:
                ok=subprocess.run(['docker','rm','--force',name],capture_output=True,timeout=15).returncode==0
            elif 'No such' not in check.stderr:
                ok=False
        except Exception:
            ok=False
        try:
            value=os.environ.get('CP7_PRIVATE_DIR')
            if value:
                target=Path(value)
                resolved=target.resolve()
                root=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
                if target.is_symlink() or resolved.parent!=root or not resolved.name.startswith('cp7-db-channel.'):
                    ok=False
                elif target.exists():
                    shutil.rmtree(target)
        except Exception:
            ok=False
        print('CP7_PRIVATE_CLEANUP='+('passed' if ok else 'failed'))
        sys.exit(0 if ok else 1)
        CP7_CLEANUP
