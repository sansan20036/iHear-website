name: Monthly isolated PostgreSQL restore drill

on:
  schedule:
    - cron: "45 18 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
    services:
      restore-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ihear_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ihear_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "BACKUP_DATABASE_URL is not configured"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "BACKUP_ENCRYPTION_PASSWORD is not configured"; exit 1; }

      # data/backup-policy.json (H8): with excludeClassroomData true (option 2), the nine classroom
      # tables are restored with their structure, constraints, indexes and row level security but
      # no rows, so this drill's copy does not protect classroom data. False until iHear approves
      # option 2; an invalid policy file stops the drill.
      - name: Read the classroom backup policy
        id: policy
        shell: bash
        run: |
          option="$(node scripts/backup-policy.mjs --pg-dump-option)"
          echo "classroom_exclusion=$option" >> "$GITHUB_OUTPUT"
          if [ -n "$option" ]; then echo "Classroom rows are left out of this drill's dump (H8 option 2)."; else echo "Classroom rows are included in this drill's dump."; fi

      - name: Create read-only Production dump
        shell: bash
        env:
          CLASSROOM_EXCLUSION: ${{ steps.policy.outputs.classroom_exclusion }}
        run: |
          rm -rf restore-output
          mkdir -p restore-output
          docker run --rm \
            -e BACKUP_DATABASE_URL \
            -e CLASSROOM_EXCLUSION \
            -v "$PWD/restore-output:/restore" \
            postgres:17-alpine \
            sh -eu -c 'pg_dump "$BACKUP_DATABASE_URL" --format=custom --no-owner --no-privileges --schema=public --exclude-table-data=public.api_rate_limits ${CLASSROOM_EXCLUSION:+"$CLASSROOM_EXCLUSION"} --file=/restore/production-public.dump'

      - name: Exercise encrypted backup round trip
        shell: bash
        run: |
          original_sha="$(sha256sum restore-output/production-public.dump | cut -d ' ' -f 1)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in restore-output/production-public.dump \
            -out restore-output/production-public.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f restore-output/production-public.dump
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in restore-output/production-public.dump.enc \
            -out restore-output/roundtrip.dump \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          restored_sha="$(sha256sum restore-output/roundtrip.dump | cut -d ' ' -f 1)"
          test "$original_sha" = "$restored_sha"
          printf '%s  %s\n' "$(sha256sum restore-output/production-public.dump.enc | cut -d ' ' -f 1)" "production-public.dump.enc" > restore-output/SHA256SUMS

      - name: Restore into isolated PostgreSQL
        shell: bash
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=restore-only-password \
            -v "$PWD/restore-output:/restore" \
            postgres:17-alpine \
            pg_restore --host=127.0.0.1 --port=55432 --username=postgres --dbname=ihear_restore --clean --if-exists --exit-on-error /restore/roundtrip.dump

      - name: Verify restored schema and data
        shell: bash
        run: |
          docker run --rm --network host -i \
            -e PGPASSWORD=restore-only-password \
            postgres:17-alpine \
            psql --host=127.0.0.1 --port=55432 --username=postgres --dbname=ihear_restore --set=ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF to_regclass('public.content_overrides') IS NULL
              OR to_regclass('public.localized_content_overrides') IS NULL
              OR to_regclass('public.impact_milestones') IS NULL
              OR to_regclass('public.team_people') IS NULL
              OR to_regclass('public.team_profiles') IS NULL
              OR to_regclass('public.site_media_assets') IS NULL
              OR to_regclass('public.site_media_variants') IS NULL
              OR to_regclass('public.site_settings') IS NULL
              OR to_regclass('public.site_layout_configs') IS NULL
              OR to_regclass('public.admin_accounts') IS NULL
              OR to_regclass('public.admin_activity_log') IS NULL
              OR to_regclass('public.site_content_revisions') IS NULL THEN
              RAISE EXCEPTION 'Required application tables are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '010') THEN
              RAISE EXCEPTION 'Migration 010 is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '011') THEN
              RAISE EXCEPTION 'Migration 011 is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '012') THEN
              RAISE EXCEPTION 'Migration 012 is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '014') THEN
              RAISE EXCEPTION 'Migration 014 is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '015') THEN
              RAISE EXCEPTION 'Migration 015 is missing';
            END IF;
            IF (SELECT COUNT(*) FROM public.site_content_revisions WHERE scope IN ('content', 'impact', 'team', 'theme', 'layout')) <> 5 THEN
              RAISE EXCEPTION 'Live revision scopes are incomplete';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.site_settings WHERE key = 'site_theme' AND value IN ('warm', 'ocean', 'sage', 'lavender', 'slate')) THEN
              RAISE EXCEPTION 'Site theme setting is missing or invalid';
            END IF;
            -- Migration 028's classroom tables, checked only once 028 is recorded (D1, 2026-11-07).
            IF EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '028') THEN
              IF to_regclass('public.classroom_lessons') IS NULL
                OR to_regclass('public.classroom_participants') IS NULL
                OR to_regclass('public.classroom_consents') IS NULL
                OR to_regclass('public.classroom_staff_notices') IS NULL
                OR to_regclass('public.classroom_join_tokens') IS NULL
                OR to_regclass('public.classroom_events') IS NULL
                OR to_regclass('public.classroom_jobs') IS NULL
                OR to_regclass('public.classroom_recording_files') IS NULL
                OR to_regclass('public.classroom_anomalies') IS NULL THEN
                RAISE EXCEPTION 'Migration 028 is recorded but classroom tables are missing';
              END IF;
              IF EXISTS (
                SELECT 1 FROM pg_class AS relation JOIN pg_namespace AS namespace ON namespace.oid = relation.relnamespace
                WHERE namespace.nspname = 'public' AND relation.relname LIKE 'classroom\_%' AND relation.relkind = 'r' AND NOT relation.relrowsecurity
              ) THEN
                RAISE EXCEPTION 'Row level security is off on a restored classroom table';
              END IF;
              IF EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename LIKE 'classroom\_%') THEN
                RAISE EXCEPTION 'A restored classroom table has a policy';
              END IF;
              IF EXISTS (
                SELECT 1 FROM public.classroom_participants
                WHERE (role = 'student' AND (join_key_hash IS NULL OR join_key_hash !~ '^[0-9a-f]{64}$')) OR (role = 'tutor' AND join_key_hash IS NOT NULL)
              ) THEN
                RAISE EXCEPTION 'A restored student link is not a key hash, or a tutor has one';
              END IF;
            END IF;
          END
          $verify$;
          SELECT json_build_object(
            'impact_milestones', (SELECT COUNT(*) FROM public.impact_milestones),
            'content_overrides', (SELECT COUNT(*) FROM public.content_overrides),
            'localized_content_overrides', (SELECT COUNT(*) FROM public.localized_content_overrides),
            'team_people', (SELECT COUNT(*) FROM public.team_people),
            'team_profiles', (SELECT COUNT(*) FROM public.team_profiles),
            'site_media_assets', (SELECT COUNT(*) FROM public.site_media_assets),
            'site_media_variants', (SELECT COUNT(*) FROM public.site_media_variants),
            'site_settings', (SELECT COUNT(*) FROM public.site_settings),
            'site_layout_configs', (SELECT COUNT(*) FROM public.site_layout_configs),
            'admin_accounts', (SELECT COUNT(*) FROM public.admin_accounts),
            'admin_activity_log', (SELECT COUNT(*) FROM public.admin_activity_log)
          ) AS restored_row_counts;
          SELECT COALESCE(json_object_agg(name, (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM public.%I', name), false, true, '')))[1]::text::integer), '{}'::json) AS restored_classroom_row_counts
          FROM unnest(ARRAY['classroom_lessons', 'classroom_participants', 'classroom_consents', 'classroom_staff_notices', 'classroom_join_tokens',
            'classroom_events', 'classroom_jobs', 'classroom_recording_files', 'classroom_anomalies']) AS name
          WHERE to_regclass('public.' || name) IS NOT NULL;
          SQL

      - name: Store drill evidence
        uses: actions/upload-artifact@v7
        with:
          name: ihear-restore-drill-${{ github.run_id }}
          path: |
            restore-output/production-public.dump.enc
            restore-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Notify restore heartbeat
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.RESTORE_HEARTBEAT_URL }}
        shell: bash
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl --fail --silent --show-error --max-time 10 "$HEARTBEAT_URL"
          fi

      - name: Remove restored plaintext and encrypted working files
        if: always()
        shell: bash
        run: rm -rf restore-output
